[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlverdict"
version = "0.2.0"
description = "Evidence-based decision engine for tabular ML: supervised classification/regression and unsupervised clustering, anomaly detection, and PCA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siva Duddukuri" }]
keywords = ["machine-learning", "automl", "model-selection", "decision-engine", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "optuna>=3.4",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
catboost = ["catboost>=1.2"]
all = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
mlverdict = "mlverdict.api.cli:main"

[project.urls]
Homepage = "https://github.com/siva1252/ml_lib"
Repository = "https://github.com/siva1252/ml_lib"
Issues = "https://github.com/siva1252/ml_lib/issues"
Documentation = "https://github.com/siva1252/ml_lib#readme"
PyPI = "https://pypi.org/project/mlverdict/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
